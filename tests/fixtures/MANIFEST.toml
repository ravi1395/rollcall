# rollcall fixture manifest. Hand-written; committed before the code it tests (spec 10.1).
# P07 wrote the git half (this file: [meta], [home], [[repo]], git [expect_counts]).
# P08 added the session tables, [[big_log]], [matching], [perf], [mcp_200], [demo] and the shell-hostile repo in root F.
# scripts/check-manifest.py checks coverage; it is complete already.
#
# ---- Schema summary (plan "Fixture manifest schema") ----
# [meta]       now (RFC 3339; ROLLCALL_NOW of every gating test), author, committer ({ name, email }).
# [[repo]]     id (unique) | root (F | EXT | H | budget | home | perf | demo) | path (relative to its root)
#              | kind (normal | bare | nested | submodule | submodule_old | special)
#              | special (kind = "special" only; the enum below) | in_clean (absent = true; false => not in F_clean)
#              | target | covers (array of bullet names, exact strings from check-manifest.py) | parent
#              | commits [{ branch, message, date, files = { path = content } }] | branches | head
#              | remotes [{ name, target_repo_id }] | upstreams { branch = "remote/branch" } | origin_head
#              | worktrees [{ path, branch, missing, external }] | state { staged, unstaged, untracked, ignored }
#              | edit { path = replacement } | config { "section.key" = "value" }
# [home]       files { relpath = content } for the sandboxed HOME; expected_suggestions (refused-root list).
# [[claude]] [[codex_thread]] [[codex_rollout]] [[big_log]] [matching] [perf] [mcp_200] [demo]: P08; keys and rules in
#   "Session-fixture conventions" below.
# [expect_counts]  hand-counted F_repos, F_worktrees and claude_sessions, codex_db_sessions, codex_rollout_sessions (below).
# Path tokens in any value: $F $EXT $H $HOME $CODEX_HOME $CLAUDE_PROJECTS $DEMO and $FIFO:<name> (a FIFO the harness creates).
# special enum: fifo_git symlink_fanout symlink_out_of_root unreadable_dir corrupted bad_gitdir untrusted_path drivers
#   submodule_lfs worktree_escape commondir_escape symlinked_files worktree_config_symlink big_object hang_probe
#   hang_probe_worktree_config enclosing_root tree_bomb tree_bomb_long excludes_file   (excludes_file added by P07, spec rev 11)
#   index_bomb index_deep_ok nested_probe exec_type big_tracked pattern_blob_bomb rename_bomb   (added by P07b, spec rev 12;
#   no new keys: their parameters ride in `target` and `config`, grammar under "Revision 12 hostile specials" below)
#
# ---- Conventions the schema left open (fixed by P07; P27b builds to these) ----
# Build order per repo: init (initial branch = first commit's branch), commits, branches, worktrees, state and edit, then
#   `config` (written by editing the config file directly, never via a git command, so drivers never run during build), then
#   `target` replacement (symlink / FIFO / rewrite) as the very last step: no git command runs in that repo afterwards.
#   Cross-repo order: submodule children and EXT repos are built before the parents and the remote fetches that use them.
# commits: made in array order, each on its `branch`. A commit on a branch that does not exist yet forks that branch from
#   the commit of the previous array entry; on an existing branch it continues that branch. Author, committer and dates are
#   fixed from [meta] and the commit's `date`, so identical entries in different repos give identical commit ids.
# branches { name = i }: extra branch ref pointing at commits[i].   head: branch name, or "detached:<i>" (commits[i]).
# Files whose content starts with "#!" are created executable.
# remotes: url = absolute path of the target repo; after every repo is built, `git fetch <name>` creates the
#   remote-tracking refs. origin_head = "main" makes refs/remotes/origin/HEAD point at origin/main. upstreams also sets
#   branch.<b>.remote and branch.<b>.merge.
# worktrees[].path: relative to the repo's root, or an explicit $TOKEN path. It is created with `git worktree add`
#   (the branch is created from HEAD if no commit made it). missing = true removes the directory afterwards.
#   external = true means the worktree lies outside F (expected `external: true` in rollcall output).
# state: staged = edit then `git add`; unstaged = edit only; untracked = new file "untracked\n"; ignored = new file
#   "ignored\n" (ignored by [home]'s global excludes file). edit values keep the committed byte length (checked).
# kind = "special" repos are non-bare unless config has core.bare = "true" (then `git init --bare`; commits still apply).
# Special repos that are directory fixtures, not repos (no commits, no row): symlink_fanout (creates <path>/d1/d2/loop-a
#   and loop-b, both symlinks to the root being built), symlink_out_of_root (symlink <path> -> target), unreadable_dir
#   (mode 000; discovery skips it, or the test skips when euid = 0).
# fifo_git is NOT a row-less directory fixture (orchestrator correction after P16): <path>/.git is a FIFO the walk never
#   opens, and discovery reports an error row: kind normal, path = <path> (the directory), `error` starting "bad gitdir: ",
#   worktrees []. It lives in H (in_clean = false) and so does not count in F_repos or F_worktrees.
# target by special: symlinked_files = the file that becomes a symlink to a sparse 4 GiB file the builder creates
#   (path relative to the git dir; "worktree:<f>" = worktree root; "objects/info/alternates#2" = second-hop alternates:
#   builder adds a hop-1 alternates entry to a helper dir whose own objects/info/alternates is the symlink;
#   "HEAD:<NAME>" = pseudo-ref: HEAD is rewritten to "ref: <NAME>" and <git dir>/<NAME> is the symlink; expected row
#   error "untrusted git dir", spec rev 11);
#   excludes_file (spec rev 11): target = a path relative to the repo's work tree that becomes the symlink, and `config`
#   sets repo-local core.excludesFile to it; expected row has NO error (the key is stripped), so P35 must scan H with a HOME
#   that has no core.excludesFile (an empty tempdir HOME, not the `home` root, whose .gitconfig sets one);
#   symlink_out_of_root = link destination; commondir_escape = id of the repo the worktree's commondir is redirected to;
#   untrusted_path = "$HOME": the linked worktree's admin gitdir file is rewritten to "$HOME/.git". Oracle decision: the
#   worktree row's path comes from that admin file (spec 4.1 enumerates from .git/worktrees/*), so it is `$HOME`, with
#   external: true and error "untrusted worktree path"; discovery dedups the on-disk untrusted-path-wt/.git file against
#   the same admin dir, so there is one row. It counts in F_worktrees. Oracles may write the `$HOME` token;
#   hang_probe / hang_probe_worktree_config = a $FIFO:<name> that replaces packed-refs / config.worktree;
#   worktree_config_symlink: the linked worktree's admin config.worktree is the symlink.
# bad_gitdir: <path>/.git is a file "gitdir: ../does-not-exist". corrupted: config sets core.repositoryformatversion = 7.
# Submodules are synthesized by the builder; neither parent's `commits` lists a gitlink or .gitmodules, and a child is never
#   discovered as `nested`. kind = "submodule": `git submodule add` of a scratch clone of the child over file://
#   (protocol.file.allow=always; child path minus the parent path is the submodule path). kind = "submodule_old": a gitlink
#   and .gitmodules entry committed in the parent, and the child kept as an in-place repo with a real .git directory.
#   Both kinds are excluded from F_repos (rows only with --submodules). submodule_lfs: the parent; its child is kind submodule.
# kind = "bare" repos with commits are built by scratch-clone-then-push.
# enclosing_root: the repo's working tree contains sub/dir; the scan root is <repo>/sub/dir.
# EXT is built alongside each F and F_clean build (case B registers a worktree inside EXT's repo).
# external_main (case B) row: lists both worktrees, the external main (external: true) and the linked one inside F (2 rows).
# Budget root: about 100 dirents, so tests set walk_budget_entries <= 50 to get `partial`.
# in_clean = false exactly for: root H or budget, or special in {corrupted bad_gitdir untrusted_path unreadable_dir
#   symlinked_files worktree_config_symlink drivers submodule_lfs worktree_escape commondir_escape big_object tree_bomb
#   tree_bomb_long hang_probe hang_probe_worktree_config fifo_git excludes_file} (spec 10.1 exclusion list; budget produces
#   `partial`).
# The sandboxed HOME is the `home` root. P08 added the shell-hostile repo `f-shell` to root F and updated [expect_counts].

# ---- Revision 12 hostile specials (P07b; P27b builds to these; all in root H, in_clean = false by root) ----
# Every repo below is built like any special repo (init, `commits`, `config`, then `target` as the last step, no git command after),
# except that index_bomb / index_deep_ok / pattern_blob_bomb / rename_bomb also write objects or the index directly (see each).
# Sparse file = created with set_len, no data blocks. "4 GiB" = 4,294,967,296 bytes; "1 GiB" = 1,073,741,824; "MiB" = 1,048,576.
# index_bomb: `target` names the variant. The builder overwrites <git dir>/index byte by byte: header DIRC, version 2, one entry
#   (README.md, its committed blob id, mode 100644, stat fields zero), then the extension(s) below, then the SHA-1 trailer of
#   everything before it (valid checksum). Sizes are the extension payload length.
#     tree_chain_1025      a TREE extension whose nodes nest 1,025 levels deep (one child per level).
#     untr_chain_1025      an UNTR extension whose directory blocks nest 1,025 levels deep.
#     reuc_2mib            a REUC extension of 2 MiB.
#     tree_wide_64mib      a TREE extension of 64 MiB, depth 3 (wide and shallow).
#     untr_wide_8mib       an UNTR extension of 8 MiB: one-byte untracked names spread over at least four directory blocks.
#     link_fifo            a `link` extension naming sharedindex.<hash>; that file is a FIFO.
#     link_symlink_sparse  a `link` extension naming sharedindex.<hash>; that file is a symlink to a sparse 4 GiB file.
#     link_chain           a `link` extension naming sharedindex.<hash>; that file is a valid index that itself carries a `link`.
#   <hash> is 40 x "a" (rollcall validates the name, it does not compare hashes).
# index_deep_ok (positive control): `target` = "v2" or "v4": index version 2 or 4 (v4 prefix-compressed names), one README.md entry,
#   then a TREE and an UNTR extension, each nested exactly 1,024 levels deep, valid checksum.
# nested_probe: no `target`. The builder adds three untracked directories to the work tree: a/.git/HEAD a FIFO; b/.git/HEAD a symlink
#   to a sparse 4 GiB file; c/.git a file containing "gitdir: ../d" with d/HEAD (d = <work tree>/d) a FIFO.
# exec_type: commits put run.sh with content starting "#!" (created 100755); `config` core.autocrlf = "true"; `target` =
#   "run.sh:symlink" (run.sh replaced by a symlink to a sparse 4 GiB file) or "run.sh:fifo" (replaced by a FIFO).
# big_tracked: `config` core.autocrlf = "true"; commits put .gitattributes "* ident\n" and data.txt (100644); `target` =
#   "data.txt:sparse:1GiB" (data.txt replaced by a 1 GiB sparse regular file).
# pattern_blob_bomb: the commit holds README.md only. Before the last step the builder writes loose blobs and index entries
#   (git update-index --add --cacheinfo; blob body = "#\n" repeated to the size in bytes; 300 KiB = 307200, 200 KiB = 204800).
#   `target` = "sub/.gitattributes:307200" (one 300 KiB blob named in the index at sub/.gitattributes; the work tree has no sub/), or
#   "sub1..sub8/.gitignore:204800:skip-worktree" (eight 200 KiB blobs, one per directory sub1 ... sub8, each entry SKIP_WORKTREE,
#   files and directories absent from the work tree).
# rename_bomb: `target` = "big-a.txt>big-b.txt:62914560:line1". Two 60 MiB (62,914,560-byte) blobs of one-byte lines ("x\n"
#   repeated): big-a.txt is committed after `commits`; then `git mv big-a.txt big-b.txt` and line 1 of big-b.txt is changed to "y"
#   (same length) and staged.

# ---- Session-fixture conventions (fixed by P08; P28 builds to these, P10 / P33 / P35 / P39 judge against them) ----
# Rows. [[claude]]: id (the session id rollcall must report), project_dir (directory name under $CLAUDE_PROJECTS; opaque, rollcall
#   never reads it), file (path under project_dir; the file stem is the fallback id; `<uuid>/subagents/<name>.jsonl` is a
#   subagent file), corpus, lines, steps, expect | excluded, worktree | unmatched, covers.
#   [[codex_thread]]: one `threads` row (id, rollout_id, rollout_path, created_at, updated_at as Unix seconds, source, cwd, title,
#   git_branch, archived, first_user_message) plus spawn_parent (one thread_spawn_edges row parent_thread_id = spawn_parent,
#   child_thread_id = id); [[codex_rollout]]: id (= session_meta.payload.id), file (path under $CODEX_HOME, or a $EXT path),
#   corpus, lines, steps, expect | excluded, worktree, covers. worktree = { repo = <[[repo]] id>, path = <worktree path token> }:
#   the worktree the session must match with no --submodules. unmatched = "non_repo" | "path_gone" | "outside_root".
#   expect keys title, title_kind, last_prompt, branch, cwd, message_count, started_at, ended_at; an ABSENT key means null
#   (TOML has no null; title and title_kind are absent together). excluded = "<reason>": the row is a child, subagent, non-uuid
#   or vanished file and yields NO session row; it is counted by the source's doctor counters, never in [expect_counts].
# lines. Every entry is one JSONL line, written verbatim plus "\n" after path-token substitution (a literal `$F` etc.; $F, $EXT,
#   $DEMO expand to canonical temp paths that contain no JSON-special character; tokens are matched longest first and hostile
#   path segments never start with an uppercase letter after `$`). Two builder tokens: `$PAD:<n>` inside a line expands to n
#   ASCII `x` (the 1 MiB+1 oversize line without a 1 MiB manifest); a line ending in `$NOEOL` is written WITHOUT its trailing
#   "\n" (a partial line, completed by the next step's first line). Invisible and control characters appear only as JSON \uXXXX.
# Prompt filter (spec 5.0, orchestrator decision): it applies to Codex event_msg user_message text as well as to response_item
#   blocks and Claude blocks; a user_message that filters to nothing is not a human prompt and is not counted in message_count.
#   Codex fixtures include such messages (a `<...>` block, a `<system-reminder>` / `<task-notification>` suffix).
# expect values are the rendered fields (spec 5, then 9: sanitise -> scrub -> truncate 200 graphemes): title, last_prompt.
#   Timestamps are the jiff Display form (Z, fraction only when non-zero; fixtures avoid trailing-zero milliseconds). Codex thread
#   started_at / ended_at come from created_at / updated_at; a rollout row's started_at is session_meta.payload.timestamp and its
#   ended_at the max top-level timestamp. expect.branch and expect.cwd are the exact stored strings (JSON keeps branch and cwd
#   exact, spec 9): the sanitise-branch row's branch keeps its \u escapes, and plain / TUI rendering is the spec 9 removal of them.
#   A skipped line (malformed, unknown type, oversize) never carries a timestamp outside the range of the known records, so
#   started_at / ended_at do not depend on whether skipped lines count. Skip counters per row are noted in comments (doctor).
# Sessions in every corpus other than `matching` are matched to a sink worktree so a run over several corpora keeps the matching
#   corpus's four unmatched sessions the only unmatched ones: claude_rules $F/dirty-mixed, codex_rules $F/untracked, incremental
#   $F/ahead-behind, privacy $F/dirty-unstaged, sanitise $F/no-upstream, shell f-shell's worktrees. P10's matching.json covers only
#   the worktrees that host `matching` sessions (its own list below); a gate that materialises other corpora too compares only those.
# Codex trees. DB mode: state_5.sqlite holding every [[codex_thread]] of the materialised corpora, and each thread's linked rollout
#   (rollout_id = that rollout's id) is written whenever its thread is, whatever the rollout's own corpus (linked rollouts are never
#   corpus `matching`; the check script counts them through the thread). rollout_path defaults to $CODEX_HOME/<rollout.file>; a
#   thread with neither rollout_id nor rollout_path gets a path to a file that does not exist. Fallback mode (database absent): a
#   $CODEX_HOME with no state_*.sqlite holding every [[codex_rollout]] of corpora codex_rules and incremental whose file lies under
#   $CODEX_HOME, linked or not; the rollout rows with `excluded` are children or outside $CODEX_HOME.
# Counting rule for [expect_counts] <source>_sessions (rows without `excluded`, corpora matching, <source>_rules, incremental):
#   claude_sessions = [[claude]] rows in claude_rules + matching + incremental = 19 + 18 + 6 = 43 (excluded: 2 in claude_rules,
#     1 in incremental); codex_db_sessions = [[codex_thread]] rows in matching + codex_rules = 2 + 8 = 10 (excluded: 3 children);
#     codex_rollout_sessions = fallback-mode rollouts = codex_rules linked 5 + codex_rules standalone 4 + incremental 1 = 10
#     (excluded: 2 children, 1 outside $CODEX_HOME). privacy, sanitise and shell rows are never counted.
# steps. The builder scans once after materialising (initial scan), then applies each step in order and scans after every step
#   whose then_scan is true. ops: append (lines written after the current end; a $NOEOL entry leaves a partial), truncate
#   (`to` = number of leading COMPLETE lines kept; the file is cut right after that many newlines), replace (a new file with a
#   new inode at the same path, holding `lines`), symlink_swap (the log is renamed to <file>.real and a symlink to it is created
#   at <file>), delete, move (rename to the path `to`, same inode). `to` is an integer for truncate and a string for move
#   (an untagged enum in P27a's struct). step expect: records = complete lines the scan consumed
#   (from the old offset, or from 0 after a re-read; incremental fixtures hold only well-formed known records), offset = byte
#   offset stored for the file after the scan, sessions = sessions that file yields after the scan (0 or 1), vanished = sessions
#   dropped by that scan. offset and `truncate.to` are TOKEN-FREE: every `$F`/`$EXT` occurrence counts as 0 bytes (each incremental
#   file has `$F` only in its first line), so the gate adds len($F) for the one token; optional extra keys (message_count, title,
#   title_kind) are checked against the session after that scan. A step with then_scan = false and `expect = { resolves = false }`
#   means: no scan; the TextRefs captured by the previous scan must now resolve to null. The row's top-level expect (or excluded)
#   is the state after the LAST scan. Pre-step state that is not an offset: I4 (incr-04) starts with title kind prompt.
# Matching corpus (20 sessions). Worktrees hosting matched sessions and their session counts: $F/normal 3 (two Claude, one Codex
#   thread; the thread ends last so `older_sessions` = 2), $F/linked 1, $F/linked-wt 2 (Claude + Codex thread, older 1), $F/merged 1,
#   $F/merged-wt 1, $F/inactive-wt 1, $F/sub-parent 1 (cwd $F/sub-parent/libs/child, a hidden submodule: matches the parent without
#   --submodules), $F/missing-wt 1 (cwd equals the missing worktree's path), $F/nest-outer/inner 1 (nest-outer also
#   encloses the cwd; the longest prefix wins), $F/nest-outer 1, $F/dirty-staged 1, $F/case-a-main 1, $F/detached 1 = 16. Unmatched: non_repo $F/bare (an
#   existing directory in no worktree), path_gone $F/gone-project (never created, outside every worktree), outside_root
#   $EXT/case-a-wt (an external linked worktree, not a candidate) and $EXT/outside-repo.
# Privacy corpus: 17 prompt sessions (14 scrub patterns, one prompt each, then three truncation payloads; every prompt carries a
#   distinct tag word such as quokka-tango-01 for the cache-file search). Every secret is a fixture string, none a real credential.
#   `privacy: email` scrubs only with redact_emails = true, so ITS expect assumes redact_emails = true; run that row with it set.
#   Truncation payloads use regional-indicator flags and base + combining marks (a ZWJ would be stripped by sanitising).
# Sanitise extent (binds P11): an ESC-introduced sequence is removed WHOLE: ESC, then for `[` (CSI) the parameter bytes
#   0x30-0x3F, intermediate bytes 0x20-0x2F and one final byte 0x40-0x7E; for any other ESC, ESC plus the one byte after it. The
#   expects rely on this: `wipe the \u001b[2Jbuild dir` renders `wipe the build dir`, never `wipe the [2Jbuild dir`.
# Sanitise corpus: gitBranch cannot hold ESC in a git ref, so `sanitise: branch name` is a session's gitBranch. The 0x9b payload
#   is followed by a non-ASCII character so no reader can mistake it for a CSI introducer that swallows following bytes.
# Shell corpus and f-shell: git rejects a space in a ref name, so the spec's branch `$(touch marker-rc)` cannot be a git branch.
#   Decision: the repo's checked-out branch is `$(true>marker-rc)` (`git check-ref-format --branch` accepts it; bash and zsh run
#   it under `eval` as a command substitution and create the file `marker-rc`, checked here; fish was NOT run here, so P39's
#   positive control must prove it for fish), and one shell session also records the spec's literal `$(touch marker-rc)` as its
#   gitBranch. The marker name `marker-rc` is fixed.
# [[big_log]] { source, bytes, single_line }: a file of exactly `bytes` bytes on one line, no newline, under a project dir of its
#   own; it yields no session (every line is oversize), only files and skipped.oversize in doctor, and is never in [expect_counts].
# [perf], [mcp_200], [demo]: the builder generates these roots; counts only. [perf] repos includes the linked_worktrees (50 repos, 20
#   of them linked worktrees of some of those repos), logs = Claude and Codex files, bytes = their total size. [mcp_200] sessions =
#   200 Claude sessions in root F worktrees, each with a title and last prompt long enough that the two tools' answers exceed
#   16 KiB. [demo]: `repos` lists the [[repo]] ids with root = "demo"; [[demo.claude]] and [[demo.codex_thread]] mirror the session
#   tables (lines, thread columns) with no corpus, expect or worktree; cwd token $DEMO is the demo root.

[meta]
now = "2026-09-28T12:00:00Z"
author = { name = "Ada Fixture", email = "ada@fixtures.test" }
committer = { name = "Ada Fixture", email = "ada@fixtures.test" }

# Sandboxed HOME. The global excludes file makes *.localignore ignored everywhere.
# expected_suggestions is OS-independent on purpose: no Documents/Desktop/Downloads/Pictures/Movies/Music/Library, which the
# refused-root peek skips on macOS only (P17's own tempdir test covers Documents/x). Excluded here: golf (repo at depth 3,
# beyond "within 2 levels"), .cache (skip dir name, all OSes) and foxtrot (6th candidate, cut by the cap of 5). Order = path order.
[home]
files = { ".gitconfig" = "[core]\n\texcludesFile = $HOME/.gitignore_global\n", ".gitignore_global" = "*.localignore\n" }
expected_suggestions = ["$HOME/alpha", "$HOME/bravo", "$HOME/charlie", "$HOME/delta", "$HOME/echo"]

# Counting rule for `rollcall status $F --json` (same for the discovery.json projection and status.json):
# F_repos = repo rows: normal, bare, nested (incl. the ones under .gitignore'd folders), external_main (case B), and
#   error rows (corrupted, bad gitdir, untrusted git dir). Not counted: submodules (only with --submodules), the enclosing
#   fixture (lives in EXT and F is not inside a repo), repos under node_modules/ or target/ (skipped), directory fixtures
#   (fan-out, symlink out of root, unreadable dir), anything reachable only through a symlink (identical in both symlink
#   modes), and everything in EXT/H/budget/home except case B's external main.
# F_worktrees = worktree rows over those repos: main + linked, including external (case A), the external main of case B,
#   missing, and the untrusted-path worktree (its row exists with an error). Bare = 0; repo-level error rows = 0.
[expect_counts]
# P07 counted 26 / 29 (see the rule above). P08 adds one repo, f-shell (main worktree + 6 shell-hostile linked worktrees):
#   F_repos = 26 + 1 = 27;   F_worktrees = 29 + (1 main + 6 linked) = 36.
F_repos = 27
F_worktrees = 36
# Session counts: rows without `excluded` in corpora matching, <source>_rules and incremental (rule and arithmetic in
