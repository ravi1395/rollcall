# ---- shell safety (P08): one repo, hostile worktree paths and a hostile branch ----
# The main worktree is checked out on `$(true>marker-rc)` (git refuses the space of the spec's `$(touch marker-rc)`); the six
# linked worktrees sit beside it in F with a space, $, backtick, ;, ' and a newline in their directory names (branches wt-*, all at
# the hostile branch's tip, 6 days before meta.now, so none is merged or inactive; no remote). Expected rows are in the P09 oracles.
[[repo]]
id = "f-shell"
root = "F"
path = "shell"
kind = "normal"
covers = ["shell: path space", "shell: path dollar", "shell: path backtick", "shell: path semicolon", "shell: path single quote", "shell: path newline", "shell: branch command substitution"]
head = "$(true>marker-rc)"
commits = [
  { branch = "main", message = "init", date = "2026-09-10T09:00:00Z", files = { "README.md" = "# shell\n" } },
  { branch = "$(true>marker-rc)", message = "hostile branch work", date = "2026-09-22T09:00:00Z", files = { "work.txt" = "w\n" } },
]
worktrees = [
  { path = "shell wt space", branch = "wt-space" },
  { path = "shell-wt$dollar", branch = "wt-dollar" },
  { path = "shell-wt`tick", branch = "wt-tick" },
  { path = "shell-wt;semi", branch = "wt-semi" },
  { path = "shell-wt'quote", branch = "wt-quote" },
  { path = "shell-wt\nnewline", branch = "wt-newline" },
]

