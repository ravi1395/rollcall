name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      # Optional-tool tests skip locally but must fail here (plan R3).
      ROLLCALL_REQUIRE_TOOLS: "1"
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish jq time
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The hostile scan's time and memory bounds are release figures (spec §4.4 rev 13, P35), so its
      # tests run on the release binary below.
      - run: cargo test --workspace --locked -- --skip hostile::scan_h
      - name: Hostile scan (release binary)
        run: cargo test --release -p rollcall-cli --test it --locked -- hostile::scan_h --nocapture
      - name: No pending snapshots
        run: test -z "$(find . -name '*.snap.new')"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit
      - run: cargo audit

  # §12.1 #17 (P40).
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: hyperfine
      - run: cargo build --release --locked -p rollcall-cli
      - name: Materialize the perf corpus
        run: |
          w=$(mktemp -d)
          echo "W=$w" >> "$GITHUB_ENV"
          ROLLCALL_MATERIALIZE_DIR="$w" cargo test -p rollcall-cli --test it --locked -- --ignored --exact materialize::materialize_perf
      - name: Cold scan and warm status
        run: |
          export PATH="$PWD/target/release:$PATH"
          export C="$W/perf" HOME="$W/home" XDG_CACHE_HOME="$W/home/.cache"
          export CLAUDE_CONFIG_DIR="$C/.agents/claude" CODEX_HOME="$C/.agents/codex"
          mkdir -p "$HOME"
          du -sh "$C"
          # The corpus must actually be read, or the timings measure nothing.
          rollcall scan "$C" 2>&1 | tee "$W/scan.txt"
          grep -Fq ': 30 repos, 50 worktrees, 5000 sessions in ' "$W/scan.txt"
          cd "$W"
          hyperfine --prepare 'rollcall cache clear' -r 5 --export-json cold.json 'rollcall scan $C'
          hyperfine -w 2 -r 10 --export-json warm.json 'rollcall status --json $C >/dev/null'
          echo "cold median: $(jq '.results[0].median' cold.json) s (limit 5)"
          echo "warm median: $(jq '.results[0].median' warm.json) s (limit 1)"
          jq -e '.results[0].median < 5' cold.json
          jq -e '.results[0].median < 1' warm.json

  # §12.1 #16 (P41): a release dry run on each native runner; release.yml itself runs only on tags and PRs.
  dist:
    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh"
      - run: dist plan
      - run: dist build --artifacts=local --target ${{ matrix.target }}
      - name: Installers and checksums
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          dist build --artifacts=global
          ls target/distrib/rollcall-cli-installer.sh target/distrib/rollcall-cli.rb target/distrib/sha256.sum
      - run: ls target/distrib/rollcall-cli-${{ matrix.target }}.tar.xz target/distrib/rollcall-cli-${{ matrix.target }}.tar.xz.sha256

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
      - run: d=$(mktemp -d) && cargo install --path crates/rollcall-cli --locked --root "$d" && "$d/bin/rollcall" --version

  # §12.1 #18 (P42): the README carries every required section and limitation, and the GIF renders from the
  # synthetic demo root with stub agents, ending on the resumed session.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README sections
        run: |
          for s in 'How is this different?' 'brew install' 'installer.sh | sh' 'cargo install' 'rollcall init' \
                   'eval "$(rollcall init zsh)"' 'claude mcp add rollcall -- rollcall mcp --root' 'mcp_servers.rollcall' '"--root"' \
                   'rollcall scan ~/Projects' '## Privacy' 'Squash merges' 'Bare repos inside other repos' \
                   'Repos owned by another user' 'Filters and LFS' 'Subdirectory ignore and attributes files' \
                   'Without `rc`, your shell stays in its directory' 'workspace-trust prompts'; do
            grep -Fq -- "$s" README.md || { echo "README is missing: $s"; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch tip at pin time
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p rollcall-cli
      - name: Materialize the demo root
        run: |
          mkdir /tmp/rc
          ROLLCALL_MATERIALIZE_DIR=/tmp/rc cargo test -p rollcall-cli --test it --locked -- --ignored --exact materialize::materialize_demo
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.11.0
          path: demo.tape
        env:
          ROLLCALL_DEMO: /tmp/rc/demo
      - name: The last frame shows the resumed session
        run: |
          # demo.txt holds every frame, each closed by a line of '─'.
          awk '/^(─)+$/ { if (frame != "") last = frame; frame = ""; next } { frame = frame $0 "\n" }
               END { printf "%s", last }' demo.txt > last-frame.txt
          cat last-frame.txt
          grep -Fq 'resumed c1a00007-0000-4000-8000-000000000001' last-frame.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: demo.gif
