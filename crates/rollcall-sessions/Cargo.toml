[package]
name = "rollcall-sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rollcall-core = { path = "../rollcall-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
gix-hash = { version = "0.28", features = ["sha1"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
